name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and Checkstyle
        run: .\mvnw.cmd -B verify

      # Runs even when the coverage check fails, which is when the report is most needed
      - name: Summarise coverage
        if: always()
        shell: pwsh
        run: |
          $csv = "target/site/jacoco/jacoco.csv"
          if (-not (Test-Path $csv)) {
            "## JaCoCo coverage`n`nNo report: the build stopped before the verify phase." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          function Pct($missed, $covered) {
            $total = $missed + $covered
            if ($total -eq 0) { return "n/a" }
            return "{0:F1}%" -f (100 * $covered / $total)
          }

          $rows = Import-Csv $csv | ForEach-Object {
            [pscustomobject]@{
              Name          = "$($_.PACKAGE).$($_.CLASS)"
              Logic         = $_.PACKAGE -like "lavs.logic*"
              LineMissed    = [int]$_.LINE_MISSED
              LineCovered   = [int]$_.LINE_COVERED
              BranchMissed  = [int]$_.BRANCH_MISSED
              BranchCovered = [int]$_.BRANCH_COVERED
            }
          }

          # Totals over the same scope as the jacoco:check rule in pom.xml
          $logic = @($rows | Where-Object Logic)
          $line = Pct ($logic | Measure-Object LineMissed -Sum).Sum ($logic | Measure-Object LineCovered -Sum).Sum
          $branch = Pct ($logic | Measure-Object BranchMissed -Sum).Sum ($logic | Measure-Object BranchCovered -Sum).Sum

          $out = @(
            "## JaCoCo coverage", "",
            "**lavs.logic** (target 95%): line $line, branch $branch", "",
            "| Class | Line | Branch |", "|---|---|---|"
          )
          # Least covered first, so gaps are at the top
          $sorted = $rows | Sort-Object @{ Expression = { $t = $_.LineMissed + $_.LineCovered; if ($t) { $_.LineCovered / $t } else { 1 } } }, Name
          foreach ($r in $sorted) {
            $out += "| $($r.Name) | $(Pct $r.LineMissed $r.LineCovered) | $(Pct $r.BranchMissed $r.BranchCovered) |"
          }
          $out -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  metrics:
    runs-on: ubuntu-latest
    env:
      CK_COMMIT: 8a1ef91   # pinned CK version
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache CK
        id: ck-cache
        uses: actions/cache@v4
        with:
          path: ck.jar
          key: ck-${{ env.CK_COMMIT }}

      - name: Build CK
        if: steps.ck-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/mauricioaniche/ck.git ck-src
          cd ck-src
          git checkout "$CK_COMMIT"
          mvn -B -q -DskipTests package
          cp target/ck-*-jar-with-dependencies.jar ../ck.jar

      - name: Run CK on LAVS
        run: |
          mkdir -p ck-report
          java -jar ck.jar src/main/java/lavs false 0 false ck-report/

      - name: Check DIT and NOC targets, and summarise
        run: |
          python3 - <<'EOF'
          import csv, os, pathlib, re, sys

          # Proposal Section 6: DIT counts the team's own classes only. CK's dit also counts
          # JDK ancestors we cannot change (e.g. RuntimeException), so work it out from source.
          own, parents = set(), {}
          for f in pathlib.Path("src/main/java/lavs").rglob("*.java"):
              text = f.read_text(encoding="utf-8")
              own.update(re.findall(r"\b(?:class|record|enum|interface)\s+(\w+)", text))
              for child, base in re.findall(r"\bclass\s+(\w+)[^{]*?\bextends\s+(\w+)", text):
                  parents[child] = base

          def team_dit(name):
              depth = 1
              while parents.get(name) in own:
                  name = parents[name]
                  depth += 1
              return depth

          rows = list(csv.DictReader(open("ck-report/class.csv")))
          failures = []
          for r in rows:
              r["team_dit"] = team_dit(re.split(r"[.$]", r["class"])[-1])
              if r["team_dit"] > 3:
                  failures.append(f"{r['class']}: DIT {r['team_dit']} (target 3 or less, team classes only)")
              if int(r["noc"]) > 10:
                  failures.append(f"{r['class']}: NOC {r['noc']} (target 10 or less)")

          # Report for reviewers: relative metrics, compared across classes
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## CK metrics\n\nDIT counts team classes only; CK DIT also counts JDK ancestors.\n\n")
              s.write("| Class | CBO | WMC | Fan-in | Fan-out | DIT | CK DIT | NOC |\n|---|---|---|---|---|---|---|---|\n")
              for r in sorted(rows, key=lambda r: -int(r["cbo"])):
                  s.write(f"| {r['class']} | {r['cbo']} | {r['wmc']} | {r['fanin']} | {r['fanout']} "
                          f"| {r['team_dit']} | {r['dit']} | {r['noc']} |\n")

          print("DIT per class (team classes only, CK value in brackets):")
          for r in sorted(rows, key=lambda r: (-r["team_dit"], r["class"])):
              print(f"{r['class']}: DIT {r['team_dit']} (CK {r['dit']})")
          
          if failures:
              print("Metric targets broken:")
              print("\n".join(failures))
              sys.exit(1)
          print(f"All {len(rows)} classes within DIT and NOC targets.")
          EOF

      - name: Upload CK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ck-report
          path: ck-report/